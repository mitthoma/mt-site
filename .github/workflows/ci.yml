name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder so page-data collection can import the contact route.
      # Real sends only happen at runtime on Vercel with the real secret.
      RESEND_API_KEY: re_ci_placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build summary
        if: always()
        run: |
          {
            echo "## Build"
            echo
            echo '```'
            du -sh .next 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Dependency audit (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: npm audit (high+)
        run: npm audit --omit=dev --audit-level=high
